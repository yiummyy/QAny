global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: qa-mvp

scrape_configs:
  - job_name: "qa-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend:8000"
        labels:
          service: "backend"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
