name: ci

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  backend-lint-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/pyproject.toml') }}
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest unit
        env:
          DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
          ES_URL: "http://localhost:9200"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "x123456789012345678901234567890xx"
          ENVIRONMENT: "test"
        run: pytest tests/unit -v --cov=app --cov-report=term

  frontend-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  backend-integration:
    runs-on: ubuntu-latest
    needs: [backend-lint-unit]
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/pyproject.toml') }}
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
          pip install 'psycopg[binary]'
      - name: Pytest integration
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db"
          ES_URL: "http://localhost:9200"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "x123456789012345678901234567890xx"
          ENVIRONMENT: "test"
        run: pytest tests/integration -v -m "integration and not es_required"
